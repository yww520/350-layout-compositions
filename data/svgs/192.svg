<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- Vertical guideline columns right-to-left -->
  <g stroke="#3B342F" stroke-width="1" stroke-dasharray="4,4">
    <line x1="410" y1="100" x2="410" y2="460"/>
    <line x1="330" y1="100" x2="330" y2="460"/>
    <line x1="250" y1="100" x2="250" y2="460"/>
    <line x1="170" y1="100" x2="170" y2="460"/>
  </g>
  <!-- Hanzi characters reading down -->
  <g fill="#E25238" font-size="32" font-weight="900" font-family="Kaiti, STKaiti, serif" text-anchor="middle">
    <text x="410" y="150">汉</text><text x="410" y="200">字</text><text x="410" y="250">直</text><text x="410" y="300">排</text>
    <text x="330" y="150">古</text><text x="330" y="200">典</text><text x="330" y="250">风</text><text x="330" y="300">骨</text>
  </g>
  <!-- Red Seal Mark -->
  <rect x="85" y="390" width="36" height="36" fill="#D32F2F" rx="2"/>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="537.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">东亚传统右起纵书行气</text>

</svg>