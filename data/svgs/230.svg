<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#081630" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2248" stroke="#162E58" stroke-width="1.5" rx="6"/>
  <!-- Grid track definitions: 1fr 2fr 1fr -->
  <text x="100" y="90" fill="#00E5FF" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">1fr</text>
  <text x="275" y="90" fill="#448AFF" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">2fr</text>
  <text x="450" y="90" fill="#00E5FF" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">1fr</text>
  <!-- Grid Cells -->
  <g stroke="#448AFF" stroke-width="1.5">
    <!-- Row 1 -->
    <rect x="70" y="110" width="80" height="100" rx="4" fill="#081630"/>
    <rect x="170" y="110" width="210" height="100" rx="4" fill="#448AFF" fill-opacity="0.8"/>
    <rect x="400" y="110" width="80" height="100" rx="4" fill="#081630"/>
    <!-- Row 2 -->
    <rect x="70" y="230" width="80" height="140" rx="4" fill="#081630"/>
    <rect x="170" y="230" width="210" height="140" rx="4" fill="#0E2248"/>
    <circle cx="275" cy="300" r="32" fill="#00E5FF"/>
    <rect x="400" y="230" width="80" height="140" rx="4" fill="#081630"/>
    <!-- Row 3 -->
    <rect x="70" y="390" width="410" height="70" rx="4" fill="#2A4B82"/>
  </g>
  <text x="275" y="432" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="Montserrat" text-anchor="middle">grid-column: 1 / -1 (FULL ROW)</text>
    <rect x="185" y="500" width="180" height="28" rx="5" fill="#448AFF"/>
  <text x="275.0" y="517.36" fill="#FFFFFF" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">二维二维网格精确排版</text>

</svg>