<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <!-- 2.39:1 Cinematic Letterbox -->
  <rect x="40" y="120" width="470" height="380" fill="#1A1D26" stroke="#FFD700" stroke-width="2" rx="6"/>
  <!-- Top and Bottom Mask -->
  <rect x="40" y="60" width="470" height="60" fill="#000000"/>
  <rect x="40" y="500" width="470" height="60" fill="#000000"/>
  <!-- Solitary Subject at 1/3 vertical line -->
  <line x1="196" y1="120" x2="196" y2="500" stroke="#333C4E" stroke-width="1.2" stroke-dasharray="6,4"/>
  <circle cx="196" cy="260" r="38" fill="#FFD700"/>
  <circle cx="196" cy="260" r="10" fill="#FFFFFF"/>
  <path d="M 140 400 Q 196 340 252 400 L 260 500 L 130 500 Z" fill="#4A5568"/>
  <!-- Vast Negative Space on Right (Looking Room) -->
  <line x1="215" y1="260" x2="440" y2="260" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="440,260 425,252 425,268" fill="#00E5FF"/>
  <text x="340" y="245" fill="#00E5FF" font-size="12" font-family="Montserrat">LOOKING ROOM</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#FFD700"/>
  <text x="275.0" y="537.36" fill="#12141A" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">单人主体与视线留白</text>

</svg>