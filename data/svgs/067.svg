<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#081630" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2248" rx="8" stroke="#162E58" stroke-width="1.5"/>
  <!-- 4 Overlapping Cards with Occlusion -->
  <!-- Layer 1 (Furthest) -->
  <rect x="240" y="110" width="210" height="200" rx="8" fill="#2A4B82" opacity="0.4" stroke="#162E58" stroke-width="1.5"/>
  <text x="345" y="150" fill="#7C92B5" font-size="14" font-family="Montserrat" text-anchor="middle">LAYER 01</text>
  <!-- Layer 2 -->
  <rect x="180" y="170" width="210" height="200" rx="8" fill="#2A4B82" opacity="0.75" stroke="#162E58" stroke-width="1.5"/>
  <text x="285" y="210" fill="#FFFFFF" font-size="14" font-family="Montserrat" text-anchor="middle">LAYER 02</text>
  <!-- Layer 3 -->
  <rect x="120" y="230" width="210" height="200" rx="8" fill="#00E5FF" opacity="0.85" stroke="#162E58" stroke-width="1.5"/>
  <text x="225" y="270" fill="#081630" font-size="14" font-weight="bold" font-family="Montserrat" text-anchor="middle">LAYER 03</text>
  <!-- Layer 4 (Forefront Hero) -->
  <rect x="70" y="290" width="210" height="200" rx="8" fill="#448AFF" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="175" cy="390" r="32" fill="#FFFFFF"/>
  <circle cx="175" cy="390" r="12" fill="#448AFF"/>
  <text x="175" y="340" fill="#081630" font-size="16" font-weight="900" font-family="Montserrat" text-anchor="middle">LAYER 04 (HERO)</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#448AFF"/>
  <text x="275.0" y="537.36" fill="#081630" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">层叠遮挡建立深度</text>

</svg>