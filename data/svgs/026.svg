  <line x1="490" y1="100" x2="60" y2="520" stroke="#FF3D00" stroke-width="5" stroke-linecap="round"/>
  <line x1="70" y1="120" x2="480" y2="530" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
