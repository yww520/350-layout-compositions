<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" rx="8" stroke="#163E32" stroke-width="1.5"/>
  <!-- Slanted 45-degree dynamic thrust vectors -->
  <line x1="60" y1="520" x2="440" y2="100" stroke="#D4E751" stroke-width="4"/>
  <polygon points="440,100 400,120 420,140" fill="#D4E751"/>
  <!-- Velocity speed bands -->
  <line x1="110" y1="540" x2="460" y2="150" stroke="#26A69A" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="70" y1="450" x2="390" y2="90" stroke="#26A69A" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- Dynamic tilted blocks -->
  <g transform="rotate(-35 275 310)">
    <rect x="215" y="240" width="120" height="140" rx="6" fill="#FF7043" opacity="0.9"/>
    <circle cx="275" cy="310" r="24" fill="#FFFFFF"/>
  </g>
  <text x="275" y="120" fill="#FFFFFF" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">DYNAMIC VELOCITY</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#FF7043"/>
  <text x="275.0" y="537.36" fill="#FFFFFF" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">倾斜动势 · 破画张力</text>

</svg>