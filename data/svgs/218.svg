<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" rx="8" stroke="#163E32" stroke-width="1.5"/>
  <!-- Vertical Chinese Characters -->
  <text x="275" y="150" fill="#D4E751" font-size="36" font-weight="900" font-family="Kaiti, serif" text-anchor="middle">解</text>
  <text x="275" y="195" fill="#D4E751" font-size="36" font-weight="900" font-family="Kaiti, serif" text-anchor="middle">读</text>
  <!-- Western word 'DESIGN' rotated 90 degrees clockwise -->
  <g transform="translate(275, 300) rotate(90)">
    <rect x="-70" y="-20" width="140" height="40" rx="4" fill="#FF7043"/>
    <text x="0" y="8" fill="#FFFFFF" font-size="22" font-weight="900" font-family="Montserrat" text-anchor="middle">DESIGN</text>
  </g>
  <text x="275" y="420" fill="#D4E751" font-size="36" font-weight="900" font-family="Kaiti, serif" text-anchor="middle">美</text>
  <text x="275" y="465" fill="#D4E751" font-size="36" font-weight="900" font-family="Kaiti, serif" text-anchor="middle">学</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#D4E751"/>
  <text x="275.0" y="537.36" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">直排中西文顺时针旋转90°</text>

</svg>