<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" rx="8" stroke="#163E32" stroke-width="1.5"/>
  <!-- Horizontal shared track lines spanning across both cards -->
  <line x1="60" y1="140" x2="490" y2="140" stroke="#FF7043" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="60" y1="260" x2="490" y2="260" stroke="#FF7043" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="60" y1="440" x2="490" y2="440" stroke="#FF7043" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Card A -->
  <rect x="75" y="90" width="180" height="360" rx="6" fill="#082018" stroke="#D4E751" stroke-width="2"/>
  <rect x="90" y="105" width="150" height="28" rx="4" fill="#D4E751"/>
  <rect x="90" y="155" width="150" height="95" rx="4" fill="#285848"/>
  <!-- Card B (Subgrid aligns with Card A's rows perfectly) -->
  <rect x="295" y="90" width="180" height="360" rx="6" fill="#082018" stroke="#D4E751" stroke-width="2"/>
  <rect x="310" y="105" width="150" height="28" rx="4" fill="#D4E751"/>
  <rect x="310" y="155" width="150" height="95" rx="4" fill="#285848"/>
  <text x="275" y="490" fill="#FF7043" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">grid-template-rows: subgrid</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#D4E751"/>
  <text x="275.0" y="537.36" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">跨父子共享轨道子网格</text>

</svg>