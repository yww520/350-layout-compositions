<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- Giant Colossal Quotation Marks -->
  <text x="80" y="180" fill="#E25238" font-size="110" font-family="Georgia, serif" opacity="0.9">“</text>
  <text x="110" y="250" fill="#FFFFFF" font-size="24" font-weight="900" font-family="PingFang SC">形式永远服从于功能，</text>
  <text x="110" y="290" fill="#E25238" font-size="24" font-weight="900" font-family="PingFang SC">这是永恒不变的自然法则。</text>
  <text x="420" y="370" fill="#E25238" font-size="110" font-family="Georgia, serif" opacity="0.9">”</text>
  <line x1="110" y1="350" x2="280" y2="350" stroke="#3B342F" stroke-width="2"/>
  <text x="110" y="380" fill="#8A827A" font-size="12" font-family="Montserrat">— LOUIS SULLIVAN (1896)</text>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="497.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">巨幅语录引文破版</text>

</svg>