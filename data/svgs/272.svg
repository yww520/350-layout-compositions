  <rect x="175" y="530" width="200" height="34" rx="6" fill="#38BDF8"/>
  <text x="275" y="552" fill="#0E1726" font-size="12" font-weight="900" font-family="PingFang SC" text-anchor="middle">圆角便当盒 · 模块化聚合</text>
