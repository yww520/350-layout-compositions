    <text x="80" y="218" fill="#0E1726" font-size="11" font-weight="900" font-family="PingFang SC" text-anchor="middle">核心主推</text>

    <!-- Top Right Card (1x1) -->
    <rect x="280" y="0" width="170" height="120" fill="#1E293B" stroke="#64748B" stroke-width="1.5" rx="12"/>
