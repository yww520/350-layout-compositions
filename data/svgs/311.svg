<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="40" y="120" width="470" height="380" fill="#2B2622" stroke="#E25238" stroke-width="2" rx="6"/>
  <rect x="40" y="60" width="470" height="60" fill="#000000"/><rect x="40" y="500" width="470" height="60" fill="#000000"/>
