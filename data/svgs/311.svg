    <circle cx="220" cy="340" r="24" fill="#FFB300"/><rect x="205" y="370" width="30" height="60" rx="3" fill="#524A44"/>
    <circle cx="330" cy="340" r="24" fill="#D32F2F"/><rect x="315" y="370" width="30" height="60" rx="3" fill="#524A44"/>
    <circle cx="430" cy="340" r="24"/><rect x="415" y="370" width="30" height="60" rx="3" fill="#524A44"/>
  </g>
  <text x="275" y="180" fill="#FAF7F2" font-size="14" font-weight="bold" font-family="Montserrat" text-anchor="middle">WES ANDERSON 2D LATERAL TABLEAU</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="537.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">横向二维平面扁平调度</text>

