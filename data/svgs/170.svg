<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#081630" rx="8"/>

  <!-- 4x5 Modular Grid Matrix -->
  <rect x="50" y="60" width="450" height="500" fill="#0E2248" stroke="#162E58" stroke-width="1.5" rx="4"/>
  <!-- Module Cells -->
  <g fill="none" stroke="#448AFF" stroke-width="1.2">
    <!-- Row 1 -->
    <rect x="70" y="80" width="85" height="75" rx="3"/>
    <rect x="175" y="80" width="85" height="75" rx="3"/>
    <rect x="280" y="80" width="85" height="75" rx="3"/>
    <rect x="385" y="80" width="85" height="75" rx="3"/>
    <!-- Row 2 (Spanned Cell) -->
    <rect x="70" y="175" width="190" height="170" rx="4" fill="#448AFF" fill-opacity="0.85"/>
    <rect x="280" y="175" width="85" height="75" rx="3"/>
    <rect x="385" y="175" width="85" height="75" rx="3"/>
    <!-- Row 3 -->
    <rect x="280" y="270" width="190" height="75" rx="4" fill="#FF5252"/>
    <!-- Row 4 -->
    <rect x="70" y="365" width="85" height="75" rx="3"/>
    <rect x="175" y="365" width="85" height="75" rx="3"/>
    <rect x="280" y="365" width="85" height="75" rx="3"/>
    <rect x="385" y="365" width="85" height="75" rx="3"/>
  </g>
  <text x="165" y="265" fill="#081630" font-size="16" font-weight="900" font-family="Montserrat" text-anchor="middle">2x2 SPAN</text>
  <text x="375" y="315" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="Montserrat" text-anchor="middle">2x1 SPAN</text>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#448AFF"/>
  <text x="275.0" y="497.36" fill="#FFFFFF" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">模块矩阵与跨单元合并</text>

</svg>