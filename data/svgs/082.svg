<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#1A1D26" rx="8" stroke="#333C4E" stroke-width="1.5"/>
  <!-- Mountain Layers fading into atmosphere -->
  <!-- Layer 5 Furthest (15% opacity) -->
  <polygon points="50,220 180,140 320,220 500,160 500,560 50,560" fill="#4A5568" opacity="0.15"/>
  <!-- Layer 4 (30% opacity) -->
  <polygon points="50,280 240,190 390,270 500,220 500,560 50,560" fill="#4A5568" opacity="0.35"/>
  <!-- Layer 3 (50% opacity) -->
  <polygon points="50,340 160,250 310,320 500,290 500,560 50,560" fill="#00E5FF" opacity="0.55"/>
  <!-- Layer 2 (75% opacity) -->
  <polygon points="50,410 260,320 440,400 500,370 500,560 50,560" fill="#FFD700" opacity="0.75"/>
  <!-- Layer 1 Closest Foreground (100% Crisp Black) -->
  <polygon points="50,470 180,390 320,460 500,430 500,560 50,560" fill="#12141A" stroke="#FFD700" stroke-width="2"/>
  <!-- Sun glow in haze -->
  <circle cx="380" cy="140" r="32" fill="#FFD700" opacity="0.4"/>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#FFD700"/>
  <text x="275.0" y="537.36" fill="#12141A" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">渐退递减大气透视</text>

</svg>