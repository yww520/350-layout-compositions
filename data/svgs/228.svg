<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" rx="8" stroke="#163E32" stroke-width="1.5"/>
  <!-- Shared Grid Row Tracks across multiple cards -->
  <line x1="60" y1="150" x2="490" y2="150" stroke="#FF7043" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="60" y1="250" x2="490" y2="250" stroke="#FF7043" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="60" y1="430" x2="490" y2="430" stroke="#FF7043" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Card A -->
  <rect x="75" y="100" width="180" height="340" rx="8" fill="#082018" stroke="#D4E751" stroke-width="2"/>
  <rect x="90" y="110" width="150" height="30" rx="4" fill="#D4E751"/>
  <rect x="90" y="160" width="150" height="80" rx="4" fill="#285848"/>
  <!-- Card B (Header & content row heights align perfectly via subgrid) -->
  <rect x="295" y="100" width="180" height="340" rx="8" fill="#082018" stroke="#D4E751" stroke-width="2"/>
  <rect x="310" y="110" width="150" height="30" rx="4" fill="#D4E751"/>
  <rect x="310" y="160" width="150" height="80" rx="4" fill="#285848"/>
  <text x="275" y="475" fill="#FF7043" font-size="13" font-weight="bold" font-family="Montserrat" text-anchor="middle">grid-template-rows: subgrid</text>
    <rect x="185" y="510" width="180" height="28" rx="5" fill="#D4E751"/>
