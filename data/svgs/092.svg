  <polygon points="320,260 335,245 315,240" fill="#FFB300"/>
  <!-- Contained Core -->
  <circle cx="275" cy="300" r="45" fill="#E25238"/>
  <circle cx="275" cy="300" r="16" fill="#FFFFFF"/>
  <text x="275" y="380" fill="#FAF7F2" font-size="13" font-weight="bold" font-family="Montserrat" text-anchor="middle">CENTRIPETAL FOCUS</text>
    <rect x="185" y="460" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="477.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">向心内聚封闭结构</text>

</svg>