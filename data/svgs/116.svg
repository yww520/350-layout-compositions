<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <!-- Proximity grouping: 2 distinct islands of 3x3 dots -->
  <!-- Left Island (x=100..200, y=180..380) -->
  <g fill="#D4E751">
    <circle cx="110" cy="200" r="16"/>
    <circle cx="160" cy="200" r="16"/>
    <circle cx="210" cy="200" r="16"/>
    <circle cx="110" cy="280" r="16"/>
    <circle cx="160" cy="280" r="16"/>
    <circle cx="210" cy="280" r="16"/>
    <circle cx="110" cy="360" r="16"/>
    <circle cx="160" cy="360" r="16"/>
    <circle cx="210" cy="360" r="16"/>
  </g>
  <rect x="85" y="170" width="150" height="220" fill="none" stroke="#D4E751" stroke-width="1.8" stroke-dasharray="6,4" rx="8"/>
  <text x="160" y="420" fill="#D4E751" font-size="13" font-weight="bold" font-family="Montserrat" text-anchor="middle">GROUP A (PROXIMITY)</text>

  <!-- Right Island (x=340..440, y=180..380) -->
  <g fill="#26A69A">
    <circle cx="340" cy="200" r="16"/>
    <circle cx="390" cy="200" r="16"/>
    <circle cx="440" cy="200" r="16"/>
    <circle cx="340" cy="280" r="16"/>
    <circle cx="390" cy="280" r="16"/>
    <circle cx="440" cy="280" r="16"/>
    <circle cx="340" cy="360" r="16"/>
    <circle cx="390" cy="360" r="16"/>
    <circle cx="440" cy="360" r="16"/>
  </g>
  <rect x="315" y="170" width="150" height="220" fill="none" stroke="#26A69A" stroke-width="1.8" stroke-dasharray="6,4" rx="8"/>
  <text x="390" y="420" fill="#26A69A" font-size="13" font-weight="bold" font-family="Montserrat" text-anchor="middle">GROUP B (PROXIMITY)</text>

  <!-- Large Inter-Group Distance Void -->
    <line x1="235" y1="280" x2="315" y2="280" stroke="#FF7043" stroke-width="1.2"/>
  <line x1="235" y1="275" x2="235" y2="285" stroke="#FF7043" stroke-width="1.2"/>
  <line x1="315" y1="275" x2="315" y2="285" stroke="#FF7043" stroke-width="1.2"/>
  <rect x="251.0" y="271" width="48" height="18" fill="#12141A" rx="3"/>
  <text x="275.0" y="284" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="Montserrat, monospace" text-anchor="middle">GAP</text>
    <rect x="185" y="480" width="180" height="30" rx="5" fill="#D4E751"/>
  <text x="275.0" y="498.6" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">距离临近凝聚为组群</text>

</svg>