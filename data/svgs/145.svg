<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#1A1D26" rx="8" stroke="#333C4E" stroke-width="1.5"/>
  <!-- Comic / Graphic Novel 6 Panels with thick gutters -->
  <!-- Row 1 (Wide panel + Narrow panel) -->
  <rect x="75" y="90" width="240" height="120" rx="4" fill="#4A5568" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="330" y="90" width="145" height="120" rx="4" fill="#FFD700" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Row 2 (3 Equal panels) -->
  <rect x="75" y="225" width="115" height="120" rx="4" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="205" y="225" width="140" height="120" rx="4" fill="#4A5568" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="360" y="225" width="115" height="120" rx="4" fill="#FF3D00" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Row 3 (Full-width climax panel) -->
  <rect x="75" y="360" width="400" height="100" rx="4" fill="#FFD700" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="275" cy="410" r="24" fill="#FFFFFF"/>
    <rect x="185" y="490" width="180" height="28" rx="5" fill="#FFD700"/>
