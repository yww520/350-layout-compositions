<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#081630" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2248" rx="8" stroke="#162E58" stroke-width="1.5"/>
  <!-- Frontal orthogonal cube face (no horizontal/vertical convergence) -->
  <rect x="110" y="210" width="200" height="200" fill="#081630" stroke="#448AFF" stroke-width="2.5"/>
  <!-- 45-degree parallel receding lines -->
  <line x1="110" y1="210" x2="220" y2="130" stroke="#00E5FF" stroke-width="2"/>
  <line x1="310" y1="210" x2="420" y2="130" stroke="#00E5FF" stroke-width="2"/>
  <line x1="310" y1="410" x2="420" y2="330" stroke="#00E5FF" stroke-width="2"/>
  <!-- Back top/right edges -->
  <line x1="220" y1="130" x2="420" y2="130" stroke="#00E5FF" stroke-width="2"/>
  <line x1="420" y1="130" x2="420" y2="330" stroke="#00E5FF" stroke-width="2"/>
  <!-- Shaded top plane -->
  <polygon points="110,210 220,130 420,130 310,210" fill="#00E5FF" opacity="0.2"/>
  <!-- Shaded right plane -->
  <polygon points="310,210 420,130 420,330 310,410" fill="#448AFF" opacity="0.35"/>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#448AFF"/>
  <text x="275.0" y="497.36" fill="#081630" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">正平投影 · 45°平行后退</text>

</svg>