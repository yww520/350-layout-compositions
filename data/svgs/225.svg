<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#081630" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2248" rx="8" stroke="#162E58" stroke-width="1.5"/>
  <!-- Outer Container with BFC Isolation boundary -->
  <rect x="75" y="90" width="400" height="390" rx="8" fill="#081630" stroke="#FF5252" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="95" y="120" fill="#FF5252" font-size="12" font-weight="bold" font-family="Montserrat">BFC CONTAINER (overflow: hidden)</text>
  <!-- Contained Float Box inside BFC -->
  <rect x="95" y="140" width="130" height="110" rx="6" fill="#448AFF"/>
  <text x="160" y="200" fill="#081630" font-size="12" font-weight="900" font-family="Montserrat" text-anchor="middle">FLOAT: LEFT</text>
  <!-- Sibling text avoiding float overlap -->
  <rect x="245" y="140" width="210" height="20" rx="3" fill="#2A4B82"/>
  <rect x="245" y="170" width="190" height="20" rx="3" fill="#2A4B82"/>
  <rect x="245" y="200" width="210" height="20" rx="3" fill="#2A4B82"/>
  <rect x="95" y="270" width="360" height="100" rx="6" fill="#00E5FF" opacity="0.8"/>
  <text x="275" y="325" fill="#081630" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">NO MARGIN COLLAPSE ACROSS BFC</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#448AFF"/>
  <text x="275.0" y="537.36" fill="#081630" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">块格式化上下文BFC隔离</text>

</svg>