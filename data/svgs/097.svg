  <circle cx="170" cy="280" r="20" fill="#FFFFFF"/>
  <!-- Right equal counterweight -->
  <circle cx="390" cy="280" r="60" fill="#FFB300"/>
  <circle cx="390" cy="280" r="16" fill="#FFFFFF"/>
  <!-- Center equilibrium line -->
  <line x1="275" y1="100" x2="275" y2="340" stroke="#D32F2F" stroke-width="1.8" stroke-dasharray="4,4"/>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#E25238"/>
