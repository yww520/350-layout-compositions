  <polygon points="275,340 245,410 305,410" fill="#524A44" stroke="#3B342F" stroke-width="2"/>
  <!-- Balance beam -->
  <line x1="80" y1="340" x2="470" y2="340" stroke="#E25238" stroke-width="3.5"/>
