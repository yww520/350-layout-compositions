      <stop offset="0%" stop-color="#FFD700" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FF9100" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF9100" stop-opacity="0"/>
