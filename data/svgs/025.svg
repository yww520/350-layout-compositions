  <line x1="500" y1="580" x2="275" y2="190" stroke="#FF9100" stroke-width="3"/>
  <!-- Horizontal Horizon Line -->
  <line x1="40" y1="190" x2="510" y2="190" stroke="#4A5568" stroke-width="1.5" stroke-dasharray="5,5"/>
