<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- Numbered Grid Lines 1 to 4 -->
  <g stroke="#FF5252" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="80" y1="90" x2="80" y2="450"/><line x1="210" y1="90" x2="210" y2="450"/>
    <line x1="340" y1="90" x2="340" y2="450"/><line x1="470" y1="90" x2="470" y2="450"/>
    <line x1="70" y1="100" x2="480" y2="100"/><line x1="70" y1="210" x2="480" y2="210"/>
    <line x1="70" y1="320" x2="480" y2="320"/><line x1="70" y1="430" x2="480" y2="430"/>
  </g>
  <!-- Line Numbers -->
  <text x="80" y="85" fill="#FF5252" font-size="11" font-family="Montserrat" text-anchor="middle">1</text>
  <text x="210" y="85" fill="#FF5252" font-size="11" font-family="Montserrat" text-anchor="middle">2</text>
  <text x="340" y="85" fill="#FF5252" font-size="11" font-family="Montserrat" text-anchor="middle">3</text>
  <text x="470" y="85" fill="#FF5252" font-size="11" font-family="Montserrat" text-anchor="middle">4</text>
  <!-- Grid area spanned cell -->
  <rect x="85" y="105" width="250" height="100" rx="6" fill="#E25238"/>
  <text x="210" y="160" fill="#1F1B18" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">grid-column: 1 / 3</text>
  <rect x="345" y="105" width="120" height="210" rx="6" fill="#FFB300"/>
  <text x="405" y="215" fill="#1F1B18" font-size="13" font-weight="900" font-family="Montserrat" text-anchor="middle">grid-row: 1 / 3</text>
  <rect x="85" y="215" width="120" height="100" rx="6" fill="#524A44"/>
  <rect x="215" y="215" width="120" height="100" rx="6" fill="#524A44"/>
    <rect x="185" y="490" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="507.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">CSS Grid 二维轨道布局</text>

</svg>