<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- Top rigid grid transitioning into bottom fluid waves -->
  <line x1="80" y1="120" x2="470" y2="120" stroke="#E25238" stroke-width="2"/>
  <line x1="80" y1="180" x2="470" y2="180" stroke="#E25238" stroke-width="2"/>
  <!-- Transitional undulating wave lines -->
  <path d="M 80 250 Q 200 210 320 270 T 470 250" fill="none" stroke="#FFB300" stroke-width="2.5"/>
  <path d="M 80 320 Q 180 380 300 290 T 470 330" fill="none" stroke="#FFB300" stroke-width="3"/>
  <path d="M 80 400 Q 220 460 350 360 T 470 410" fill="none" stroke="#D32F2F" stroke-width="3.5"/>
  <text x="275" y="95" fill="#FAF7F2" font-size="13" font-weight="bold" font-family="Montserrat" text-anchor="middle">RIGID ORTHOGONAL → FLUID ORGANIC</text>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="497.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">刚性网格向流体渐变过渡</text>

</svg>