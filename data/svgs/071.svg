<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <!-- 30-Degree Axonometric Isometric Cubes -->
  <!-- Cube 1 (Center) -->
  <g transform="translate(275, 290)">
    <!-- Top Face -->
    <polygon points="0,-70 60,-35 0,0 -60,-35" fill="#D4E751"/>
    <!-- Left Face -->
    <polygon points="-60,-35 0,0 0,70 -60,35" fill="#26A69A"/>
    <!-- Right Face -->
    <polygon points="0,0 60,-35 60,35 0,70" fill="#285848"/>
  </g>
  <!-- Cube 2 (Left Lower) -->
  <g transform="translate(175, 410)">
    <polygon points="0,-50 45,-25 0,0 -45,-25" fill="#D4E751" opacity="0.7"/>
    <polygon points="-45,-25 0,0 0,50 -45,25" fill="#26A69A" opacity="0.7"/>
    <polygon points="0,0 45,-25 45,25 0,50" fill="#285848" opacity="0.7"/>
  </g>
  <!-- Cube 3 (Right Lower) -->
  <g transform="translate(375, 410)">
    <polygon points="0,-50 45,-25 0,0 -45,-25" fill="#D4E751" opacity="0.7"/>
    <polygon points="-45,-25 0,0 0,50 -45,25" fill="#26A69A" opacity="0.7"/>
    <polygon points="0,0 45,-25 45,25 0,50" fill="#285848" opacity="0.7"/>
  </g>
  <!-- Isometric 30-deg grid guidelines -->
  <line x1="50" y1="440" x2="500" y2="180" stroke="#163E32" stroke-width="1" stroke-dasharray="6,6"/>
  <line x1="50" y1="180" x2="500" y2="440" stroke="#163E32" stroke-width="1" stroke-dasharray="6,6"/>
    <rect x="185" y="80" width="180" height="30" rx="5" fill="#D4E751"/>
  <text x="275.0" y="98.6" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">30° 等轴测无衰减</text>

</svg>