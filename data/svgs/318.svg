<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="50" width="450" height="520" fill="#2B2622" rx="6" stroke="#E25238" stroke-width="1.5"/>
  <!-- High: Top peak -->
  <polygon points="275,80 190,260 360,260" fill="#524A44"/>
  <text x="370" y="110" fill="#E25238" font-size="12" font-family="Kaiti, serif">[高远]</text>
  <!-- Deep: Winding mid ravine -->
  <path d="M 140 260 Q 275 320 410 260" fill="none" stroke="#E25238" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="110" y="290" fill="#FFB300" font-size="12" font-family="Kaiti, serif">[深远]</text>
  <!-- Level: Vast low water -->
  <line x1="60" y1="430" x2="490" y2="430" stroke="#3B342F" stroke-width="2"/>
  <text x="275" y="460" fill="#8A827A" font-size="12" font-family="Kaiti, serif" text-anchor="middle">[平远]</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="537.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">高深平三远一统大观</text>

</svg>