<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <!-- 4 Columns x 8 Rows = 32 Field Grid -->
  <rect x="40" y="50" width="470" height="520" fill="#1A1D26" stroke="#333C4E" stroke-width="1.5"/>
  <g stroke="#3A4050" stroke-width="1" stroke-dasharray="3,3">
    <line x1="145" y1="50" x2="145" y2="570"/>
    <line x1="255" y1="50" x2="255" y2="570"/>
    <line x1="365" y1="50" x2="365" y2="570"/>
    <line x1="40" y1="108" x2="510" y2="108"/>
    <line x1="40" y1="166" x2="510" y2="166"/>
    <line x1="40" y1="224" x2="510" y2="224"/>
    <line x1="40" y1="282" x2="510" y2="282"/>
    <line x1="40" y1="340" x2="510" y2="340"/>
    <line x1="40" y1="398" x2="510" y2="398"/>
    <line x1="40" y1="456" x2="510" y2="456"/>
  </g>
  <!-- Iconic Bold Red Accent Modules (Müller-Brockmann Zurich Concert Poster style) -->
  <rect x="150" y="112" width="210" height="110" fill="#FFD700"/>
  <text x="165" y="165" fill="#12141A" font-size="28" font-weight="900" font-family="Helvetica, Arial, sans-serif">musica</text>
  <text x="165" y="195" fill="#12141A" font-size="28" font-weight="900" font-family="Helvetica, Arial, sans-serif">viva</text>
  <!-- Secondary Field Accent -->
  <rect x="260" y="345" width="100" height="105" fill="#FF3D00"/>
  <circle cx="310" cy="397" r="24" fill="#FFFFFF"/>
  <text x="275" y="515" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="Helvetica, sans-serif" text-anchor="middle">32-FIELD RATIONAL SWISS ORDER</text>
    <rect x="185" y="535" width="180" height="28" rx="5" fill="#FFD700"/>
  <text x="275.0" y="552.36" fill="#12141A" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">32 格理性网格系统</text>

</svg>