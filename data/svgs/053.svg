<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <!-- Inward Converging Arrows Pointing to Epicenter (275, 310) -->
  <line x1="80" y1="120" x2="220" y2="260" stroke="#FFD700" stroke-width="4"/>
  <polygon points="225,265 210,250 230,245" fill="#FFD700"/>
  <line x1="470" y1="120" x2="330" y2="260" stroke="#FFD700" stroke-width="4"/>
  <polygon points="325,265 340,245 320,250" fill="#FFD700"/>
  <line x1="80" y1="500" x2="220" y2="360" stroke="#FFD700" stroke-width="4"/>
  <polygon points="225,355 210,370 230,375" fill="#FFD700"/>
  <line x1="470" y1="500" x2="330" y2="360" stroke="#FFD700" stroke-width="4"/>
  <polygon points="325,355 340,375 320,370" fill="#FFD700"/>
  <!-- Concentric Rings Contracted Inward -->
  <circle cx="275" cy="310" r="160" fill="none" stroke="#333C4E" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="275" cy="310" r="90" fill="none" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="4,4"/>
  <!-- Dense Inward Singularity Core -->
  <circle cx="275" cy="310" r="32" fill="#FF3D00"/>
  <circle cx="275" cy="310" r="8" fill="#FFFFFF"/>
    <rect x="185" y="470" width="180" height="30" rx="5" fill="#FFD700"/>
  <text x="275.0" y="488.6" fill="#12141A" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">向心引力坍缩</text>

</svg>