<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="50" width="450" height="520" fill="#2B2622" stroke="#E25238" stroke-width="1.5" rx="6"/>
  <!-- 1. Distant Minimal Hills (Far Bank) -->
  <path d="M 80 150 Q 180 110 270 140 T 460 130" fill="none" stroke="#524A44" stroke-width="3"/>
  <polygon points="120,150 180,120 240,150" fill="#524A44" opacity="0.5"/>
  <polygon points="310,140 370,115 430,140" fill="#524A44" opacity="0.4"/>
  <text x="275" y="100" fill="#8A827A" font-size="12" font-family="Kaiti, STKaiti, serif" text-anchor="middle">远岫平林</text>

  <!-- 2. Vast Calm River Void (Middle Empty Field) -->
  <rect x="70" y="170" width="410" height="190" fill="none" stroke="#E25238" stroke-width="1" stroke-dasharray="6,6" opacity="0.4"/>
  <text x="275" y="270" fill="#8A827A" font-size="22" font-family="Kaiti, STKaiti, serif" text-anchor="middle" letter-spacing="8">大水漫漫 · 虚怀澄澈</text>

  <!-- 3. Foreground Rocky Bank with Sparse Trees (Near Bank) -->
  <polygon points="60,520 180,410 320,440 480,520" fill="#524A44"/>
  <!-- Two Sparse Solitary Trees (Ni Zan style) -->
  <line x1="160" y1="420" x2="150" y2="300" stroke="#E25238" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="300" x2="120" y2="260" stroke="#E25238" stroke-width="2.5"/>
  <line x1="150" y1="300" x2="180" y2="250" stroke="#E25238" stroke-width="2.5"/>
  <line x1="190" y1="430" x2="200" y2="320" stroke="#E25238" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="200" y1="320" x2="230" y2="280" stroke="#E25238" stroke-width="2"/>
  <!-- Red Seal Mark (Top Right) -->
  <rect x="420" y="80" width="30" height="30" fill="#D32F2F" rx="2"/>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="537.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">倪瓒一河两岸三段式</text>

</svg>