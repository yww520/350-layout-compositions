<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- Golden Diagonal diagonals of Van de Graaf canon -->
  <line x1="50" y1="60" x2="500" y2="560" stroke="#E25238" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="500" y1="60" x2="50" y2="560" stroke="#E25238" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Classical text block (2:3:4:6 margin ratio) -->
  <rect x="130" y="140" width="290" height="340" fill="#1F1B18" stroke="#E25238" stroke-width="2.5" rx="4"/>
  <text x="275" y="280" fill="#E25238" font-size="18" font-weight="900" font-family="Georgia, serif" text-anchor="middle">VAN DE GRAAF CANON</text>
  <text x="275" y="310" fill="#8A827A" font-size="12" font-family="Montserrat" text-anchor="middle">MARGIN RATIO 2 : 3 : 4 : 6</text>
    <rect x="185" y="510" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="527.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">中世纪手抄本黄金范式</text>

</svg>