<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <!-- Canonical F-Pattern Eyetracking Heatmap Path -->
  <!-- Top Horizontal Bar 1 (Full width reading) -->
  <rect x="60" y="90" width="430" height="35" fill="#E25238" rx="4"/>
  <!-- Middle Horizontal Bar 2 (Half width reading) -->
  <rect x="60" y="190" width="280" height="30" fill="#FFB300" rx="4"/>
  <!-- Lower Horizontal Bar 3 (Shorter scan) -->
  <rect x="60" y="280" width="180" height="25" fill="#524A44" rx="4"/>
  <!-- Vertical Left Scan Corridor -->
  <rect x="60" y="90" width="40" height="420" fill="#E25238" opacity="0.6" rx="4"/>
  <!-- Eyetracking heatmap flow vectors -->
  <line x1="80" y1="105" x2="480" y2="105" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="205" x2="330" y2="205" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="292" x2="230" y2="292" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="105" x2="80" y2="500" stroke="#D32F2F" stroke-width="4" stroke-dasharray="6,4"/>
    <rect x="185" y="450" width="180" height="30" rx="5" fill="#E25238"/>
  <text x="275.0" y="468.6" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">F 型眼动热区模型</text>

</svg>