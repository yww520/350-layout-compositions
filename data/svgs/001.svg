<svg viewBox="0 0 580 790" width="580" height="790" xmlns="http://www.w3.org/2000/svg">
  <!-- Card background -->
  <rect width="580" height="790" fill="#FAF7F0"/>

  <!-- 3x3 Grid Lines (Coral red dashed) -->
  <line x1="193.33" y1="0" x2="193.33" y2="790" stroke="#E03E2D" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.85"/>
  <line x1="386.66" y1="0" x2="386.66" y2="790" stroke="#E03E2D" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.85"/>
  <line x1="0" y1="263.33" x2="580" y2="263.33" stroke="#E03E2D" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.85"/>
  <line x1="0" y1="526.66" x2="580" y2="526.66" stroke="#E03E2D" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.85"/>

  <!-- Intersection Anchors (diameter 16px) -->
  <circle cx="386.66" cy="263.33" r="8" fill="#E03E2D"/>
  <circle cx="193.33" cy="526.66" r="8" fill="#E03E2D"/>
  <circle cx="386.66" cy="526.66" r="8" fill="#E03E2D"/>

  <!-- Flying Birds in upper right -->
  <path d="M 450 200 Q 462 190 474 200 Q 486 190 498 200" fill="none" stroke="#1A1A1A" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 490 220 Q 500 212 510 220 Q 520 212 530 220" fill="none" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 470 242 Q 478 235 487 242 Q 495 235 504 242" fill="none" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Primary Focal Element: The Sun (Diameter ~130px) -->
  <circle cx="193.33" cy="263.33" r="65" fill="#E03E2D"/>

  <!-- Secondary Sandy Mountain behind -->
  <polygon points="140,790 320,545 540,790" fill="#DDD4C5"/>

  <!-- Foreground Dark Charcoal Mountain -->
  <polygon points="0,790 0,680 125,510 400,790" fill="#262626"/>
  <!-- Shadow facet of foreground mountain -->
  <polygon points="125,510 215,790 400,790" fill="#1B1B1B"/>

  <!-- Dense horizontal water ripples across the bottom -->
  <line x1="290" y1="715" x2="520" y2="715" stroke="#E03E2D" stroke-width="2.0" opacity="0.65"/>
  <line x1="330" y1="732" x2="495" y2="732" stroke="#E03E2D" stroke-width="1.8" opacity="0.6"/>
  <line x1="375" y1="748" x2="530" y2="748" stroke="#E03E2D" stroke-width="1.6" opacity="0.55"/>
  <line x1="415" y1="764" x2="505" y2="764" stroke="#E03E2D" stroke-width="1.4" opacity="0.5"/>
  <line x1="440" y1="778" x2="490" y2="778" stroke="#E03E2D" stroke-width="1.2" opacity="0.45"/>
</svg>