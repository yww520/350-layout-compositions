<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- Outer room boundary -->
  <rect x="90" y="100" width="370" height="420" fill="none" stroke="#524A44" stroke-width="2"/>
  <!-- Inner back wall -->
  <rect x="200" y="220" width="150" height="160" fill="#1F1B18" stroke="#E25238" stroke-width="2.5"/>
  <!-- Corner rays converging to single center vanishing point -->
  <line x1="90" y1="100" x2="200" y2="220" stroke="#E25238" stroke-width="2"/>
  <line x1="460" y1="100" x2="350" y2="220" stroke="#E25238" stroke-width="2"/>
  <line x1="90" y1="520" x2="200" y2="380" stroke="#E25238" stroke-width="2"/>
  <line x1="460" y1="520" x2="350" y2="380" stroke="#E25238" stroke-width="2"/>
  <!-- Central Vanishing Point -->
  <circle cx="275" cy="300" r="24" fill="#E25238" opacity="0.2"/>
  <circle cx="275" cy="300" r="8" fill="#E25238"/>
  <circle cx="275" cy="300" r="2.5" fill="#FFFFFF"/>
  <text x="275" y="335" fill="#E25238" font-size="10" font-weight="bold" font-family="Montserrat" text-anchor="middle">VP (VANISHING POINT)</text>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="497.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">单灭点焦点汇聚空间</text>

</svg>