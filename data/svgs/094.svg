  <!-- Focus Node 2 (Beta) -->
  <circle cx="380" cy="240" r="26" fill="#26A69A"/>
  <circle cx="380" cy="240" r="8" fill="#FFFFFF"/>
  <text x="380" y="195" fill="#26A69A" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">FOCUS β</text>
  <!-- Focus Node 3 (Gamma) -->
  <circle cx="250" cy="420" r="22" fill="#FF7043"/>
  <circle cx="250" cy="420" r="6" fill="#FFFFFF"/>
  <text x="250" y="470" fill="#FF7043" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">FOCUS γ</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#D4E751"/>
