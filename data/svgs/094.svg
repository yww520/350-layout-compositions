  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" rx="8" stroke="#163E32" stroke-width="1.5"/>
  <!-- Interconnecting Tension Triangle -->
  <polygon points="170,200 380,240 250,420" fill="none" stroke="#163E32" stroke-width="2" stroke-dasharray="6,6"/>
