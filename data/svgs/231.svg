<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#1A1D26" rx="8" stroke="#333C4E" stroke-width="1.5"/>
  <!-- Floated Image Box Left -->
  <rect x="80" y="110" width="150" height="140" rx="6" fill="#FFD700"/>
  <circle cx="155" cy="180" r="32" fill="#12141A"/>
  <text x="155" y="140" fill="#12141A" font-size="12" font-weight="900" font-family="Montserrat" text-anchor="middle">float: left;</text>
  <!-- Text lines wrapping around float -->
  <g fill="#4A5568">
    <rect x="245" y="110" width="220" height="12" rx="2"/>
    <rect x="245" y="135" width="220" height="12" rx="2"/>
    <rect x="245" y="160" width="220" height="12" rx="2"/>
    <rect x="245" y="185" width="200" height="12" rx="2"/>
    <rect x="245" y="210" width="220" height="12" rx="2"/>
    <rect x="245" y="235" width="180" height="12" rx="2"/>
    <!-- Text resumed below float -->
    <rect x="80" y="270" width="385" height="12" rx="2"/>
    <rect x="80" y="295" width="385" height="12" rx="2"/>
  </g>
  <!-- Clearfix indicator bar -->
  <line x1="80" y1="330" x2="465" y2="330" stroke="#FF3D00" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="275" y="360" fill="#FF3D00" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">clear: both; (CLEARFIX BARRIER)</text>
    <rect x="185" y="500" width="180" height="28" rx="5" fill="#FFD700"/>
  <text x="275.0" y="517.36" fill="#12141A" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">经典图文浮动与闭合</text>

</svg>