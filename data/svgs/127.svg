<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <!-- Canonical Z-Pattern Path for Landing Pages -->
  <!-- 1. Top Left Anchor (Logo) -->
  <rect x="60" y="90" width="70" height="40" fill="#E25238" rx="4"/>
  <text x="95" y="115" fill="#1F1B18" font-size="12" font-weight="900" font-family="Montserrat" text-anchor="middle">LOGO</text>
  <!-- 2. Top Right Anchor (Action / Nav) -->
  <rect x="380" y="90" width="110" height="40" fill="#524A44" rx="4"/>
  <text x="435" y="115" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">NAV / CTA</text>
  <!-- 3. Bottom Left Anchor (Supporting Visual) -->
  <rect x="60" y="440" width="140" height="70" fill="#524A44" rx="4"/>
  <text x="130" y="480" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">BENEFIT</text>
  <!-- 4. Bottom Right Anchor (Final Conversion CTA) -->
  <rect x="340" y="440" width="150" height="70" fill="#E25238" rx="6"/>
  <text x="415" y="480" fill="#1F1B18" font-size="15" font-weight="900" font-family="Montserrat" text-anchor="middle">CONVERT</text>
  <!-- Bold Z Vector Flow Path -->
  <path d="M 95 110 L 435 110 L 130 475 L 415 475" fill="none" stroke="#E25238" stroke-width="4.5" stroke-dasharray="8,6" stroke-linecap="round"/>
  <polygon points="425,475 410,465 410,485" fill="#E25238"/>
    <rect x="185" y="270" width="180" height="32" rx="5" fill="#E25238"/>
  <text x="275.0" y="289.84" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">经典 Z 型扫描流</text>

</svg>