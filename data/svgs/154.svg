<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#081630" rx="8"/>

  <!-- Holy Grail Layout Wireframe -->
  <!-- 1. Header (Span 100%) -->
  <rect x="50" y="60" width="450" height="60" rx="6" fill="#448AFF"/>
  <text x="275" y="96" fill="#081630" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">HEADER · FULL SPAN</text>
  <!-- 2. Left Nav Sidebar -->
  <rect x="50" y="140" width="95" height="320" rx="6" fill="#0E2248" stroke="#162E58" stroke-width="1.5"/>
  <text x="97" y="290" fill="#7C92B5" font-size="12" font-family="Montserrat" text-anchor="middle">NAV</text>
  <!-- 3. Center Main Body Content (Fluid Flexible) -->
  <rect x="160" y="140" width="230" height="320" rx="6" fill="#0E2248" stroke="#448AFF" stroke-width="2"/>
  <circle cx="275" cy="240" r="36" fill="#00E5FF"/>
  <text x="275" y="310" fill="#FFFFFF" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">MAIN CONTENT</text>
  <!-- 4. Right Aside Sidebar -->
  <rect x="405" y="140" width="95" height="320" rx="6" fill="#0E2248" stroke="#162E58" stroke-width="1.5"/>
  <text x="452" y="290" fill="#7C92B5" font-size="12" font-family="Montserrat" text-anchor="middle">ASIDE</text>
  <!-- 5. Footer (Span 100%) -->
  <rect x="50" y="480" width="450" height="60" rx="6" fill="#2A4B82"/>
  <text x="275" y="515" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">FOOTER</text>
    <rect x="185" y="410" width="180" height="28" rx="5" fill="#448AFF"/>
  <text x="275.0" y="427.36" fill="#081630" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">经典圣杯三栏骨架</text>

</svg>