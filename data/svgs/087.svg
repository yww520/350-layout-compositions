<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <!-- Fulcrum balance beam on center axis (x=275, y=360) -->
  <line x1="100" y1="360" x2="450" y2="360" stroke="#E25238" stroke-width="3"/>
  <polygon points="275,360 255,410 295,410" fill="#524A44"/>
  <!-- Left Weight Block -->
  <rect x="120" y="240" width="100" height="120" fill="#E25238" rx="6"/>
  <circle cx="170" cy="300" r="16" fill="#FFFFFF"/>
  <!-- Right Identical Weight Block -->
  <rect x="330" y="240" width="100" height="120" fill="#E25238" rx="6"/>
  <circle cx="380" cy="300" r="16" fill="#FFFFFF"/>
  <!-- Center Vertical Axis Guide -->
  <line x1="275" y1="80" x2="275" y2="520" stroke="#3B342F" stroke-width="1.8" stroke-dasharray="6,6"/>
    <rect x="185" y="470" width="180" height="30" rx="5" fill="#E25238"/>
  <text x="275.0" y="488.6" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">均等对称静态平衡</text>

</svg>