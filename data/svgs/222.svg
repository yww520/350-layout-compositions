<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#081630" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2248" rx="8" stroke="#162E58" stroke-width="1.5"/>
  <!-- Vertical Block Stacking -->
  <rect x="80" y="100" width="390" height="60" rx="6" fill="#448AFF"/>
  <text x="275" y="135" fill="#081630" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">BLOCK 1 (100% WIDTH)</text>
  <!-- Inline Elements flowing horizontally -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="110" height="40" rx="4" fill="#2A4B82"/>
    <text x="55" y="25" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="Montserrat" text-anchor="middle">INLINE 1</text>
    <rect x="125" y="0" width="130" height="40" rx="4" fill="#2A4B82"/>
    <text x="190" y="25" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="Montserrat" text-anchor="middle">INLINE 2</text>
    <rect x="270" y="0" width="120" height="40" rx="4" fill="#2A4B82"/>
    <text x="330" y="25" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="Montserrat" text-anchor="middle">INLINE 3</text>
  </g>
  <rect x="80" y="245" width="390" height="120" rx="6" fill="#00E5FF" fill-opacity="0.85"/>
  <text x="275" y="310" fill="#081630" font-size="16" font-weight="900" font-family="Montserrat" text-anchor="middle">BLOCK 2 (VERTICAL CASCADE)</text>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#448AFF"/>
  <text x="275.0" y="497.36" fill="#081630" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">块级向下行内横向标准流</text>

</svg>