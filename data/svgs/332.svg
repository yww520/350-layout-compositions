<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="50" y="50" width="450" height="520" fill="#0E2D23" stroke="#D4E751" stroke-width="1.5" rx="6"/>
  <!-- 4 Flow Quadrants -->
  <!-- 1. 起 (Introduction) -->
  <circle cx="130" cy="150" r="26" fill="#D4E751"/><text x="130" y="156" fill="#082018" font-size="16" font-weight="900" font-family="Kaiti, serif" text-anchor="middle">起</text>
  <line x1="160" y1="150" x2="360" y2="190" stroke="#163E32" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- 2. 承 (Elaboration) -->
  <circle cx="390" cy="200" r="32" fill="#26A69A"/><text x="390" y="206" fill="#082018" font-size="18" font-weight="900" font-family="Kaiti, serif" text-anchor="middle">承</text>
  <line x1="380" y1="235" x2="150" y2="345" stroke="#163E32" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- 3. 转 (Climax Shift) -->
  <circle cx="130" cy="350" r="38" fill="#FF7043"/><text x="130" y="358" fill="#FFFFFF" font-size="20" font-weight="900" font-family="Kaiti, serif" text-anchor="middle">转</text>
  <line x1="170" y1="360" x2="350" y2="410" stroke="#163E32" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- 4. 合 (Resolution) -->
  <circle cx="380" cy="420" r="28" fill="#D4E751"/><text x="380" y="426" fill="#082018" font-size="16" font-weight="900" font-family="Kaiti, serif" text-anchor="middle">合</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#D4E751"/>
  <text x="275.0" y="537.36" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">四段演进起承转合</text>

</svg>