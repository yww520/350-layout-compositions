<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="40" y="60" width="470" height="500" rx="8" fill="#0E2D23" stroke="#163E32" stroke-width="1.5"/>
  <!-- 3 Translucent Intersecting Circles -->
  <!-- Circle A (Top) -->
  <circle cx="275" cy="220" r="120" fill="#D4E751" fill-opacity="0.35" stroke="#D4E751" stroke-width="2.5"/>
  <text x="275" y="150" fill="#D4E751" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">DESIRABLE</text>

  <!-- Circle B (Bottom Left) -->
  <circle cx="205" cy="330" r="120" fill="#26A69A" fill-opacity="0.35" stroke="#26A69A" stroke-width="2.5"/>
  <text x="140" y="400" fill="#26A69A" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">FEASIBLE</text>

  <!-- Circle C (Bottom Right) -->
  <circle cx="345" cy="330" r="120" fill="#FF7043" fill-opacity="0.35" stroke="#FF7043" stroke-width="2.5"/>
  <text x="410" y="400" fill="#FF7043" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">VIABLE</text>

  <!-- Central Triple Intersection Nexus (SWEET SPOT) -->
  <circle cx="275" cy="295" r="26" fill="#FFFFFF"/>
  <circle cx="275" cy="295" r="8" fill="#082018"/>
  <text x="275" y="260" fill="#FFFFFF" font-size="11" font-weight="900" font-family="Montserrat" text-anchor="middle">SWEET SPOT</text>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#D4E751"/>
  <text x="275.0" y="537.36" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">三维文氏交集甜点</text>

</svg>