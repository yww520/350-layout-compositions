<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- 30° Isometric Axis Grid -->
  <g stroke="#3B342F" stroke-width="1" stroke-dasharray="4,4" opacity="0.5">
    <line x1="275" y1="100" x2="275" y2="520"/>
    <line x1="80" y1="200" x2="470" y2="425"/>
    <line x1="470" y1="200" x2="80" y2="425"/>
  </g>
  <!-- Isometric Center Cube (30 deg angles) -->
  <!-- Top Rhombus -->
  <polygon points="275,180 379,240 275,300 171,240" fill="#FFB300" opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Left Rhombus -->
  <polygon points="171,240 275,300 275,420 171,360" fill="#E25238" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Right Rhombus -->
  <polygon points="275,300 379,240 379,360 275,420" fill="#524A44" stroke="#FFFFFF" stroke-width="2"/>
  <text x="275" y="245" fill="#1F1B18" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">ISOMETRIC 30°</text>
    <rect x="185" y="490" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="507.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">等轴测 30° 均等无衰减</text>

</svg>