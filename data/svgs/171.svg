<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#081630" rx="8"/>

  <!-- Equidistant 8pt Baseline Grid Lines -->
  <g stroke="#FF4081" stroke-width="0.8" opacity="0.6">
    <line x1="50" y1="80" x2="500" y2="80"/>
    <line x1="50" y1="104" x2="500" y2="104"/>
    <line x1="50" y1="128" x2="500" y2="128"/>
    <line x1="50" y1="152" x2="500" y2="152"/>
    <line x1="50" y1="176" x2="500" y2="176"/>
    <line x1="50" y1="200" x2="500" y2="200"/>
    <line x1="50" y1="224" x2="500" y2="224"/>
    <line x1="50" y1="248" x2="500" y2="248"/>
    <line x1="50" y1="272" x2="500" y2="272"/>
    <line x1="50" y1="296" x2="500" y2="296"/>
    <line x1="50" y1="320" x2="500" y2="320"/>
    <line x1="50" y1="344" x2="500" y2="344"/>
    <line x1="50" y1="368" x2="500" y2="368"/>
    <line x1="50" y1="392" x2="500" y2="392"/>
    <line x1="50" y1="416" x2="500" y2="416"/>
    <line x1="50" y1="440" x2="500" y2="440"/>
    <line x1="50" y1="464" x2="500" y2="464"/>
    <line x1="50" y1="488" x2="500" y2="488"/>
    <line x1="50" y1="512" x2="500" y2="512"/>
  </g>
  <!-- Cap-Height & X-Height Guide Bands -->
  <rect x="70" y="128" width="410" height="48" fill="#448AFF" fill-opacity="0.15"/>
  <line x1="70" y1="128" x2="480" y2="128" stroke="#00E5FF" stroke-width="1.5"/>
  <line x1="70" y1="152" x2="480" y2="152" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="176" x2="480" y2="176" stroke="#FF5252" stroke-width="2"/>
  <!-- Typography Samples aligned on baseline -->
  <text x="80" y="176" fill="#FFFFFF" font-size="52" font-weight="900" font-family="Helvetica, Arial, sans-serif">Ag9</text>
  <text x="210" y="176" fill="#00E5FF" font-size="28" font-weight="bold" font-family="Helvetica">Baseline 24pt</text>
  <!-- Second Typography block -->
  <text x="80" y="272" fill="#FFFFFF" font-size="36" font-weight="900" font-family="Helvetica">Rhythm</text>
  <text x="80" y="320" fill="#7C92B5" font-size="18" font-family="Helvetica">Consistent vertical cadence throughout</text>
  <text x="80" y="344" fill="#7C92B5" font-size="18" font-family="Helvetica">every typographic element.</text>
  <!-- Labels -->
  <text x="495" y="128" fill="#00E5FF" font-size="9" font-family="Montserrat">CAP</text>
  <text x="495" y="152" fill="#00E5FF" font-size="9" font-family="Montserrat">MEAN</text>
  <text x="495" y="176" fill="#FF5252" font-size="9" font-family="Montserrat">BASE</text>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#448AFF"/>
  <text x="275.0" y="497.36" fill="#FFFFFF" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">严格对齐基准垂直律动</text>

</svg>