<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <!-- Floor Perspective Grid Receding to Vanishing Point (275, 230) -->
  <polygon points="40,570 510,570 275,230" fill="#0E2D23"/>
  <g stroke="#D4E751" stroke-width="1.8">
    <line x1="40" y1="570" x2="275" y2="230"/>
    <line x1="130" y1="570" x2="275" y2="230"/>
    <line x1="220" y1="570" x2="275" y2="230"/>
    <line x1="275" y1="570" x2="275" y2="230" stroke="#FFFFFF" stroke-dasharray="6,4"/>
    <line x1="330" y1="570" x2="275" y2="230"/>
    <line x1="420" y1="570" x2="275" y2="230"/>
    <line x1="510" y1="570" x2="275" y2="230"/>
  </g>
  <!-- Transverse Perspective Floor Transverses -->
  <line x1="75" y1="520" x2="475" y2="520" stroke="#D4E751" stroke-width="1.5"/>
  <line x1="115" y1="460" x2="435" y2="460" stroke="#D4E751" stroke-width="1.5"/>
  <line x1="160" y1="390" x2="390" y2="390" stroke="#D4E751" stroke-width="1.2"/>
  <line x1="210" y1="310" x2="340" y2="310" stroke="#D4E751" stroke-width="1"/>
  <!-- Horizon Line -->
  <line x1="30" y1="230" x2="520" y2="230" stroke="#163E32" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Vanishing Point Sun -->
  <circle cx="275" cy="230" r="36" fill="#D4E751" opacity="0.25"/>
  <circle cx="275" cy="230" r="14" fill="#D4E751"/>
  <circle cx="275" cy="230" r="4" fill="#FFFFFF"/>
    <rect x="185" y="120" width="180" height="30" rx="5" fill="#D4E751"/>
  <text x="275.0" y="138.6" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">一点单灭点透视</text>

</svg>