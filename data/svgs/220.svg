<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#1A1D26" rx="8" stroke="#333C4E" stroke-width="1.5"/>
  <!-- RTL Arabic / Hebrew band -->
  <rect x="80" y="140" width="390" height="80" rx="6" fill="#FF3D00" opacity="0.85"/>
  <text x="440" y="190" fill="#FFFFFF" font-size="24" font-weight="bold" font-family="Arial" text-anchor="end">مرحبا بالعالم (RTL)</text>
  <!-- LTR English band -->
  <rect x="80" y="250" width="390" height="80" rx="6" fill="#FFD700"/>
  <text x="110" y="300" fill="#12141A" font-size="24" font-weight="900" font-family="Montserrat">HELLO WORLD (LTR)</text>
  <!-- Opposing flow vectors -->
  <line x1="430" y1="120" x2="110" y2="120" stroke="#FF3D00" stroke-width="3"/>
  <polygon points="110,120 125,112 125,128" fill="#FF3D00"/>
  <line x1="110" y1="350" x2="430" y2="350" stroke="#FFD700" stroke-width="3"/>
  <polygon points="430,350 415,342 415,358" fill="#FFD700"/>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#FFD700"/>
  <text x="275.0" y="497.36" fill="#12141A" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">阿文英文双向文字混合</text>

</svg>