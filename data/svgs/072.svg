<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" rx="8" stroke="#163E32" stroke-width="1.5"/>
  <!-- Sky Zenith VP at top center -->
  <circle cx="275" cy="90" r="6" fill="#D4E751"/>
  <!-- Left VP and Right VP on horizon at y: 480 -->
  <circle cx="70" cy="480" r="6" fill="#26A69A"/>
  <circle cx="480" cy="480" r="6" fill="#26A69A"/>
  <!-- Towering Monolith converging to 3 points -->
  <polygon points="275,130 380,390 275,460 170,390" fill="#082018" stroke="#D4E751" stroke-width="2.5"/>
  <!-- Center corner ridge -->
  <line x1="275" y1="130" x2="275" y2="460" stroke="#D4E751" stroke-width="3"/>
  <!-- Left face facets -->
  <line x1="170" y1="390" x2="275" y2="340" stroke="#26A69A" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Right face facets -->
  <line x1="380" y1="390" x2="275" y2="340" stroke="#26A69A" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Zenith Convergence lines -->
  <line x1="170" y1="390" x2="275" y2="90" stroke="#163E32" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="380" y1="390" x2="275" y2="90" stroke="#163E32" stroke-width="1.2" stroke-dasharray="4,4"/>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#D4E751"/>
  <text x="275.0" y="537.36" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">仰望摩天三点透视</text>

</svg>