<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- Columns 1 to 4 right to left -->
  <g fill="#E25238" font-size="28" font-weight="900" font-family="Kaiti, STKaiti, serif" text-anchor="middle">
    <text x="420" y="140">千</text><text x="420" y="180">山</text><text x="420" y="220">鸟</text><text x="420" y="260">飞</text><text x="420" y="300">绝</text>
    <text x="340" y="140">万</text><text x="340" y="180">径</text><text x="340" y="220">人</text><text x="340" y="260">踪</text><text x="340" y="300">灭</text>
    <text x="260" y="140">孤</text><text x="260" y="180">舟</text><text x="260" y="220">蓑</text><text x="260" y="260">笠</text><text x="260" y="300">翁</text>
    <text x="180" y="140">独</text><text x="180" y="180">钓</text><text x="180" y="220">寒</text><text x="180" y="260">江</text><text x="180" y="300">雪</text>
  </g>
  <!-- Right to left column progression arrow -->
  <line x1="430" y1="350" x2="170" y2="350" stroke="#D32F2F" stroke-width="2.5"/>
  <polygon points="170,350 185,342 185,358" fill="#D32F2F"/>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="497.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">古典右起直排线装书卷</text>

</svg>