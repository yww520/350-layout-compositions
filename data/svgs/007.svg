<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <!-- Odd triad grouping (3 primary elements vs awkward even pair) -->
  <g stroke="#3B342F" stroke-width="1.5" stroke-dasharray="5,5">
    <line x1="160" y1="280" x2="275" y2="200"/>
    <line x1="275" y1="200" x2="390" y2="320"/>
    <line x1="160" y1="280" x2="390" y2="320"/>
  </g>
  <!-- Node 1 (Left) -->
  <circle cx="160" cy="280" r="42" fill="#2B2622" stroke="#E25238" stroke-width="2"/>
  <circle cx="160" cy="280" r="12" fill="#524A44"/>
  <text x="160" y="285" fill="#FAF7F2" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">01</text>
  <!-- Node 2 (Apex Hero) -->
  <circle cx="275" cy="200" r="54" fill="#E25238" opacity="0.2"/>
  <circle cx="275" cy="200" r="38" fill="#E25238"/>
  <circle cx="275" cy="200" r="10" fill="#FFFFFF"/>
  <text x="275" y="205" fill="#1F1B18" font-size="16" font-weight="900" font-family="Montserrat" text-anchor="middle">02</text>
  <!-- Node 3 (Right) -->
  <circle cx="390" cy="320" r="46" fill="#2B2622" stroke="#E25238" stroke-width="2"/>
  <circle cx="390" cy="320" r="14" fill="#524A44"/>
  <text x="390" y="325" fill="#FAF7F2" font-size="14" font-weight="900" font-family="Montserrat" text-anchor="middle">03</text>
  <!-- Triangle Tension Badge -->
    <rect x="185" y="450" width="180" height="32" rx="5" fill="#E25238"/>
  <text x="275.0" y="469.84" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">奇数组群 · 动态平衡</text>

</svg>