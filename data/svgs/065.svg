<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <!-- Frame -->
  <rect x="50" y="60" width="450" height="500" fill="#2B2622" rx="8" stroke="#3B342F" stroke-width="1.5"/>
  <!-- Background: Distant Mountain Ridge (Low contrast, Pale) -->
  <path d="M 50 280 Q 180 210 280 250 T 500 230 L 500 560 L 50 560 Z" fill="#524A44" opacity="0.3"/>
  <text x="80" y="200" fill="#8A827A" font-size="11" font-family="Montserrat">BACKGROUND (FAR)</text>
  <!-- Midground: Architecture / Subject (Medium contrast) -->
  <rect x="180" y="260" width="190" height="180" rx="6" fill="#524A44" opacity="0.7"/>
  <polygon points="180,260 275,170 370,260" fill="#E25238" opacity="0.85"/>
  <text x="275" y="320" fill="#FFFFFF" font-size="11" font-family="Montserrat" text-anchor="middle">MIDGROUND (SUBJECT)</text>
  <!-- Foreground: Dark Silhouetted Framing Tree/Rocks (High contrast) -->
  <path d="M 50 360 Q 120 340 160 420 Q 200 500 240 560 L 50 560 Z" fill="#1F1B18" stroke="#E25238" stroke-width="2"/>
  <circle cx="110" cy="390" r="26" fill="#1F1B18" stroke="#E25238" stroke-width="1.5"/>
  <text x="80" y="490" fill="#E25238" font-size="11" font-weight="bold" font-family="Montserrat">FOREGROUND</text>
  <!-- Depth Vector -->
  <line x1="110" y1="390" x2="275" y2="230" stroke="#E25238" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="275" cy="230" r="12" fill="#E25238"/>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="537.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">前中后三层深度纵深</text>

</svg>