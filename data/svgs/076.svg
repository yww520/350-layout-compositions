<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" rx="8" stroke="#163E32" stroke-width="1.5"/>
  <!-- Exploded vertical layers floating on Z axis -->
  <line x1="275" y1="110" x2="275" y2="480" stroke="#FF7043" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Layer 1 Top Component -->
  <polygon points="275,130 380,180 275,230 170,180" fill="#D4E751" opacity="0.9" stroke="#FFFFFF" stroke-width="2"/>
  <text x="275" y="185" fill="#082018" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">LAYER 01 (ROOF)</text>
  <!-- Layer 2 Middle Component -->
  <polygon points="275,240 380,290 275,340 170,290" fill="#26A69A" opacity="0.8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="275" y="295" fill="#082018" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">LAYER 02 (STRUCTURE)</text>
  <!-- Layer 3 Base Foundation -->
  <polygon points="275,350 380,400 275,450 170,400" fill="#285848" stroke="#FFFFFF" stroke-width="2"/>
  <text x="275" y="405" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="Montserrat" text-anchor="middle">LAYER 03 (BASE)</text>
    <rect x="185" y="510" width="180" height="28" rx="5" fill="#D4E751"/>
  <text x="275.0" y="527.36" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">轴测分解爆炸图示</text>

</svg>