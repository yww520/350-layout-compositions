<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <!-- Radial Ray Beam Burst from Epicenter (275, 310) -->
  <g stroke="#FFD700" stroke-width="2">
    <line x1="275" y1="310" x2="50" y2="80"/>
    <line x1="275" y1="310" x2="275" y2="50"/>
    <line x1="275" y1="310" x2="500" y2="80"/>
    <line x1="275" y1="310" x2="520" y2="310"/>
    <line x1="275" y1="310" x2="500" y2="540"/>
    <line x1="275" y1="310" x2="275" y2="570"/>
    <line x1="275" y1="310" x2="50" y2="540"/>
    <line x1="275" y1="310" x2="30" y2="310"/>
    <!-- Interstitial Fine Beams -->
    <line x1="275" y1="310" x2="160" y2="60" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="275" y1="310" x2="390" y2="60" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="275" y1="310" x2="520" y2="200" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="275" y1="310" x2="520" y2="420" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="275" y1="310" x2="390" y2="560" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="275" y1="310" x2="160" y2="560" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="275" y1="310" x2="30" y2="420" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="275" y1="310" x2="30" y2="200" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4"/>
  </g>
  <!-- Solar Burst Core -->
  <circle cx="275" cy="310" r="50" fill="#FFD700" opacity="0.25"/>
  <circle cx="275" cy="310" r="26" fill="#FFD700"/>
  <circle cx="275" cy="310" r="8" fill="#FFFFFF"/>
    <rect x="185" y="470" width="180" height="30" rx="5" fill="#FFD700"/>
  <text x="275.0" y="488.6" fill="#12141A" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">全向放射爆发</text>

</svg>