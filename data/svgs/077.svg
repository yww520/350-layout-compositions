<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <!-- 90-Degree Orthogonal Map Plan View -->
  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" stroke="#163E32" stroke-width="2" rx="6"/>
  <!-- Street / Corridor Grid Lines -->
  <rect x="100" y="110" width="140" height="170" fill="#285848" rx="4"/>
  <rect x="280" y="110" width="170" height="170" fill="#285848" rx="4"/>
  <rect x="100" y="320" width="140" height="190" fill="#285848" rx="4"/>
  <rect x="280" y="320" width="170" height="190" fill="#285848" rx="4"/>
  <!-- Crossroad Intersection (x=260, y=300) -->
  <circle cx="260" cy="300" r="32" fill="#D4E751" opacity="0.25"/>
  <circle cx="260" cy="300" r="16" fill="#D4E751"/>
  <circle cx="260" cy="300" r="4" fill="#FFFFFF"/>
  <!-- Top-down view compass -->
  <polygon points="460,90 455,110 465,110" fill="#FF7043"/>
  <text x="460" y="85" fill="#FF7043" font-size="10" font-weight="900" text-anchor="middle">N</text>
    <rect x="185" y="490" width="180" height="30" rx="5" fill="#D4E751"/>
  <text x="275.0" y="508.6" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">90° 垂直俯瞰全景</text>

</svg>