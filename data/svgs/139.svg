<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <!-- Pure white outer sheet margin -->
  <rect x="50" y="60" width="450" height="500" fill="#FFFFFF" rx="6" stroke="#524A44" stroke-width="2"/>
  <!-- Safe Print Content Area strictly inset by 30px -->
  <rect x="90" y="100" width="370" height="420" fill="#1F1B18" rx="4" stroke="#E25238" stroke-width="2"/>
  <line x1="110" y1="140" x2="440" y2="140" stroke="#E25238" stroke-width="3"/>
  <rect x="110" y="170" width="150" height="140" rx="4" fill="#524A44"/>
  <rect x="280" y="170" width="160" height="140" rx="4" fill="#2B2622"/>
  <!-- Dimension arrows showing safe margin -->
    <line x1="50" y1="80" x2="90" y2="80" stroke="#D32F2F" stroke-width="1.2"/>
  <line x1="50" y1="75" x2="50" y2="85" stroke="#D32F2F" stroke-width="1.2"/>
  <line x1="90" y1="75" x2="90" y2="85" stroke="#D32F2F" stroke-width="1.2"/>
  <rect x="46.0" y="71" width="48" height="18" fill="#12141A" rx="3"/>
  <text x="70.0" y="84" fill="#D32F2F" font-size="10" font-weight="bold" font-family="Montserrat, monospace" text-anchor="middle">30mm</text>
    <line x1="460" y1="80" x2="500" y2="80" stroke="#D32F2F" stroke-width="1.2"/>
  <line x1="460" y1="75" x2="460" y2="85" stroke="#D32F2F" stroke-width="1.2"/>
  <line x1="500" y1="75" x2="500" y2="85" stroke="#D32F2F" stroke-width="1.2"/>
  <rect x="456.0" y="71" width="48" height="18" fill="#12141A" rx="3"/>
  <text x="480.0" y="84" fill="#D32F2F" font-size="10" font-weight="bold" font-family="Montserrat, monospace" text-anchor="middle">30mm</text>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="497.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">安全内缩白边装帧</text>

</svg>