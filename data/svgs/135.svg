<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <!-- Two facing pages with center spine -->
  <rect x="50" y="80" width="215" height="440" fill="#2B2622" stroke="#3B342F" stroke-width="1.5" rx="4"/>
  <rect x="285" y="80" width="215" height="440" fill="#2B2622" stroke="#3B342F" stroke-width="1.5" rx="4"/>
  <!-- Book Spine Gutter -->
  <line x1="275" y1="60" x2="275" y2="540" stroke="#E25238" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Symmetrical Content Left -->
  <rect x="80" y="120" width="155" height="120" fill="#E25238" opacity="0.85" rx="4"/>
  <rect x="80" y="260" width="155" height="18" rx="3" fill="#524A44"/>
  <rect x="80" y="290" width="135" height="10" rx="2" fill="#8A827A"/>
  <rect x="80" y="310" width="145" height="10" rx="2" fill="#8A827A"/>
  <!-- Symmetrical Content Right (Mirror) -->
  <rect x="315" y="120" width="155" height="120" fill="#E25238" opacity="0.85" rx="4"/>
  <rect x="315" y="260" width="155" height="18" rx="3" fill="#524A44"/>
  <rect x="335" y="290" width="135" height="10" rx="2" fill="#8A827A"/>
  <rect x="325" y="310" width="145" height="10" rx="2" fill="#8A827A"/>
    <rect x="185" y="520" width="180" height="28" rx="5" fill="#E25238"/>
  <text x="275.0" y="537.36" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">中缝镜像对称跨页</text>

</svg>