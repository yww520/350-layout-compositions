<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#1F1B18" rx="8"/>

  <!-- Fulcrum at center x=275, y=360 -->
  <line x1="70" y1="360" x2="480" y2="360" stroke="#E25238" stroke-width="3"/>
  <polygon points="275,360 255,410 295,410" fill="#524A44"/>
  <!-- Large Light Low-Density Area on Left (Close to fulcrum) -->
  <rect x="110" y="160" width="140" height="200" fill="#2B2622" stroke="#3B342F" stroke-width="2" rx="6"/>
  <text x="180" y="265" fill="#8A827A" font-size="14" font-family="Montserrat" text-anchor="middle">LARGE / LIGHT</text>
  <!-- Small Dense High-Contrast Red Anchor on Right (Far out on arm) -->
  <rect x="400" y="290" width="70" height="70" fill="#E25238" rx="6"/>
  <circle cx="435" cy="325" r="14" fill="#FFFFFF"/>
  <!-- Distance leverage indicators -->
  <line x1="180" y1="380" x2="275" y2="380" stroke="#E25238" stroke-width="1.2"/>
  <line x1="275" y1="380" x2="435" y2="380" stroke="#E25238" stroke-width="1.2"/>
    <rect x="185" y="470" width="180" height="30" rx="5" fill="#E25238"/>
  <text x="275.0" y="488.6" fill="#1F1B18" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">杠杆力矩非对称平衡</text>

</svg>