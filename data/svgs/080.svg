<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <!-- 15-Degree Tilted Frame -->
  <g transform="rotate(15 275 310)">
    <rect x="60" y="90" width="430" height="440" fill="#0E2D23" stroke="#FF7043" stroke-width="3" rx="6"/>
    <!-- Horizon Canted -->
    <line x1="40" y1="310" x2="510" y2="310" stroke="#D4E751" stroke-width="3"/>
    <circle cx="275" cy="250" r="28" fill="#FF7043"/>
    <circle cx="275" cy="250" r="8" fill="#FFFFFF"/>
  </g>
  <!-- True Level Reference Dashed Line -->
  <line x1="30" y1="310" x2="520" y2="310" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.5"/>
  <text x="440" y="300" fill="#FFFFFF" font-size="11" font-family="Montserrat" opacity="0.7">HORIZON 0°</text>
    <rect x="185" y="480" width="190" height="30" rx="5" fill="#FF7043"/>
  <text x="280.0" y="498.6" fill="#FFFFFF" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">15° 倾斜失衡心理张力</text>

</svg>