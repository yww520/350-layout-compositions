<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#082018" rx="8"/>

  <rect x="50" y="60" width="450" height="500" fill="#0E2D23" rx="8" stroke="#163E32" stroke-width="1.5"/>
  <!-- Vertical columns progressing Left to Right (e.g. Mongolian script) -->
  <g fill="#26A69A" font-size="24" font-family="Montserrat" text-anchor="middle">
    <text x="150" y="150">A</text><text x="150" y="190">B</text><text x="150" y="230">C</text>
    <text x="230" y="150">D</text><text x="230" y="190">E</text><text x="230" y="230">F</text>
    <text x="310" y="150">G</text><text x="310" y="190">H</text><text x="310" y="230">I</text>
    <text x="390" y="150">J</text><text x="390" y="190">K</text><text x="390" y="230">L</text>
  </g>
  <!-- LTR arrow -->
  <line x1="140" y1="300" x2="400" y2="300" stroke="#D4E751" stroke-width="2.5"/>
  <polygon points="400,300 385,292 385,308" fill="#D4E751"/>
  <text x="275" y="350" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Montserrat" text-anchor="middle">VERTICAL LTR COLUMN SEQUENCE</text>
    <rect x="185" y="480" width="180" height="28" rx="5" fill="#D4E751"/>
  <text x="275.0" y="497.36" fill="#082018" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">蒙古文回鹘式左起纵书</text>

</svg>