<svg viewBox="0 0 550 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="550" height="620" fill="#12141A" rx="8"/>

  <!-- Perspective Architectural Trapezoid -->
  <polygon points="170,120 380,120 480,520 70,520" fill="#1A1D26" stroke="#FFD700" stroke-width="2.5"/>
  <!-- Internal Horizontal Tiers -->
  <line x1="145" y1="220" x2="405" y2="220" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="120" y1="320" x2="430" y2="320" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="95" y1="420" x2="455" y2="420" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Skyward Vanishing Vectors -->
  <line x1="70" y1="520" x2="275" y2="30" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="480" y1="520" x2="275" y2="30" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="4,4"/>
    <rect x="185" y="470" width="180" height="30" rx="5" fill="#FFD700"/>
  <text x="275.0" y="488.6" fill="#12141A" font-size="11" font-weight="900" font-family="PingFang SC, -apple-system, sans-serif" text-anchor="middle">梯形纵深延伸</text>

</svg>