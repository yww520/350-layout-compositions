    <!-- Row 4 -->
    <rect x="0" y="384" width="105" height="96" fill="#E53935" rx="4"/>
    <rect x="105" y="384" width="105" height="96" fill="#212128" rx="4"/>
    <rect x="210" y="384" width="105" height="96" fill="#E53935" rx="4"/>
