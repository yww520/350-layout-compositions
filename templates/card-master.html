<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{CARD_ID}} {{TITLE}} - 350 Layout Compositions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+SC:wght@900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    /* THEME SYSTEM (CSS Variables) */
    :root {
      --bg-canvas: #F8F4EC;
      --bg-card: #FDFBF7;
      --accent: #E25238;
      --text-main: #111111;
      --text-sub: #383531;
      --text-muted: #555047;
      --border-outer: #E6DFD3;
      --border-card: #E4DDD2;
      --icon-bg: #E25238;
      --icon-fg: #FFFFFF;
      --divider: #E2DCD1;
    }

    body[data-theme="forest-green"] {
      --bg-canvas: #09241C;
      --bg-card: #0D2D23;
      --accent: #D4AF37;
      --text-main: #FFFFFF;
      --text-sub: #D1E5DE;
      --text-muted: #8AAEA3;
      --border-outer: rgba(212, 175, 55, 0.3);
      --border-card: rgba(212, 175, 55, 0.35);
      --icon-bg: #D4AF37;
      --icon-fg: #09241C;
      --divider: rgba(212, 175, 55, 0.25);
    }

    body[data-theme="obsidian-black"] {
      --bg-canvas: #0C0C0C;
      --bg-card: #151515;
      --accent: #FFD700;
      --text-main: #FFFFFF;
      --text-sub: #D8D8D8;
      --text-muted: #888888;
      --border-outer: rgba(255, 215, 0, 0.25);
      --border-card: rgba(255, 215, 0, 0.35);
      --icon-bg: #FFD700;
      --icon-fg: #0C0C0C;
      --divider: rgba(255, 215, 0, 0.25);
    }

    body[data-theme="cobalt-blue"] {
      --bg-canvas: #0B2B68;
      --bg-card: #082154;
      --accent: #FFD000;
      --text-main: #FFFFFF;
      --text-sub: #D6E4FF;
      --text-muted: #8EB3F5;
      --border-outer: rgba(255, 255, 255, 0.2);
      --border-card: rgba(255, 208, 0, 0.35);
      --icon-bg: #FFD000;
      --icon-fg: #0B2B68;
      --divider: rgba(255, 255, 255, 0.15);
    }

    body {
      width: 1086px;
      height: 1448px;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 48px 56px 42px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* ================= HEADER ================= */
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .meta-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .meta-left-cn {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .meta-left-en {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .meta-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .meta-right-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.04em;
    }

    .meta-right-bar {
      width: 44px;
      height: 3.5px;
      background-color: var(--accent);
      border-radius: 2px;
    }

    /* Main Big Title */
    .main-title {
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 96px;
      font-weight: 900;
      line-height: 1.0;
      color: var(--text-main);
      letter-spacing: -0.01em;
      -webkit-text-stroke: 2px var(--text-main);
      margin-top: 8px;
      margin-bottom: 4px;
    }

    /* Subtitle in English */
    .subtitle-en {
      font-family: 'Montserrat', sans-serif;
      font-size: 33px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    /* Description paragraph */
    .description-box {
      font-size: 18.5px;
      line-height: 1.5;
      color: var(--text-sub);
      font-weight: 600;
      margin-top: 10px;
      letter-spacing: 0.02em;
    }

    /* ================= MAIN CONTENT GRID ================= */
    .main-content {
      display: grid;
      grid-template-columns: {{COLUMNS_RATIO}};
      gap: 30px;
      align-items: stretch;
      margin-top: 14px;
    }

    /* Visual Canvas Card */
    .visual-box {
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      height: 790px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .visual-box svg {
      width: 100%;
      height: 100%;
    }

    /* Features Column */
    .feature-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 790px;
      padding: 4px 0 2px 0;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 34px;
    }

    .feature-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .feature-icon-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--icon-bg);
      color: var(--icon-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feature-icon-circle svg {
      width: 28px;
      height: 28px;
      stroke-width: 2.3;
    }

    .feature-text-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .feature-title {
      font-size: 21px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 0.02em;
    }

    .feature-desc {
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--text-sub);
      font-weight: 600;
    }

    .feature-tag-en {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Tips Card */
    .tips-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .tips-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 900;
      color: var(--text-main);
    }

    .tips-header svg {
      width: 22px;
      height: 22px;
      color: var(--accent);
    }

    .tips-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tips-list li {
      position: relative;
      padding-left: 14px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-sub);
      font-weight: 600;
    }

    .tips-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 900;
      font-size: 18px;
      line-height: 1.1;
    }

    .tips-bottom-bar {
      width: 48px;
      height: 3.5px;
      background-color: var(--accent);
      border-radius: 2px;
      margin-top: 4px;
    }

    /* ================= FOOTER KEYWORDS ================= */
    .footer {
      border-top: 1.5px solid var(--border-outer);
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .footer-title-row span.en {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    .footer-bar-accent {
      width: 32px;
      height: 3px;
      background-color: var(--accent);
      border-radius: 2px;
      margin-top: -6px;
    }

    .keywords-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
    }

    .kw-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
    }

    .kw-item:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 10%;
      height: 80%;
      width: 1px;
      background-color: var(--divider);
    }

    .kw-item svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
      stroke-width: 2.2;
    }

    .kw-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .kw-cn {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
    }

    .kw-en {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body data-theme="{{THEME}}">

  <!-- HEADER -->
  <header class="header">
    <div class="header-meta-row">
      <div class="meta-left">
        <span class="meta-left-cn">{{CATEGORY}}</span>
        <span class="meta-left-en">{{CATEGORY_EN}}</span>
      </div>
      <div class="meta-right">
        <span class="meta-right-text">{{TAGLINE}}</span>
        <div class="meta-right-bar"></div>
      </div>
    </div>

    <h1 class="main-title">{{TITLE}}</h1>
    <div class="subtitle-en">{{SUBTITLE_EN}}</div>

    <div class="description-box">
      {{DESCRIPTION}}
    </div>
  </header>

  <!-- MAIN SECTION -->
  <main class="main-content">
    {{MAIN_CONTENT_HTML}}
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-title-row">
      <span>关键词</span>
      <span class="en">KEYWORDS</span>
    </div>
    <div class="footer-bar-accent"></div>

    <div class="keywords-row">
      {{KEYWORDS_HTML}}
    </div>
  </footer>

</body>
</html>
