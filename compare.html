<html lang="zh-CN">

  <style>
    :root {

      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #d4e751;
      --accent-rgb: 212, 231, 81;
      --danger: #f85149;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      padding-bottom: 60px;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 32px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .title-area h1 {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(var(--accent-rgb), 0.15);
      color: var(--accent);
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      font-weight: 600;
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .stats-bar strong {
      color: var(--text);
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
    }
    .search-box input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px 8px 36px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
      pointer-events: none;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .filter-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(var(--accent-rgb), 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

      max-width: 1800px;
      margin: 0 auto;
      padding: 24px 32px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(820px, 1fr));
      gap: 28px;
    }
    .compare-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .compare-card:hover {
      border-color: #484f58;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c2128;
    }
    .card-title-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .card-num {
      font-family: monospace;
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }
    .card-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .card-en {
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 500;
    }
    .card-cat {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #21262d;
      color: var(--text-dim);
    }
    .card-body {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: #0d1117;
    }
    .col-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 4px;
    }
    .col-label.orig span.tag {
      color: #8b949e;
      background: #21262d;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .col-label.new span.tag {
      color: var(--accent);
      background: rgba(var(--accent-rgb), 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .img-box {
      position: relative;
      aspect-ratio: 1086 / 1448;
      background: #161b22;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: zoom-in;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s;
    }
    .img-box:hover img {
      transform: scale(1.02);
    }
    .card-footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
      background: #161b22;
    }
    .view-link {
      color: var(--blue);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .view-link:hover {
      text-decoration: underline;
    }
    /* Lightbox modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
    }

  const CATEGORIES = ["构图逻辑", "视觉原则与阅读模式", "平面、出版与广告", "字体、网格与东亚文字", "网页与 UI", "影视画面构图", "中国传统构图", "演示文稿页面"];

  let currentCategory = 'ALL';
  let searchQuery = '';

  function init() {
    renderFilters();
    renderCards();
    updateStats();

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderCards();
    });
  }

  function renderFilters() {
    const container = document.getElementById('category-filters');
    let html = '<button class="filter-btn active" onclick="setCategory(\'ALL\', this)">全部全部 (350)</button>';
    CATEGORIES.forEach(cat => {
      const count = ITEMS.filter(it => it.category === cat).length;
      html += `<button class="filter-btn" onclick="setCategory('${cat}', this)">${cat} (${count})</button>`;
    });
    container.innerHTML = html;
  }

  function setCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards();
  }

  function updateStats() {
    let rendered = 0;
    ITEMS.forEach(it => {
      // In browser, we count how many are displayed
      rendered++;
    });
    document.getElementById('total-count').textContent = ITEMS.length;
  }

  function renderCards() {
    const container = document.getElementById('cards-container');
    const filtered = ITEMS.filter(it => {
      const matchCat = (currentCategory === 'ALL' || it.category === currentCategory);
      const q = searchQuery;
      const matchSearch = !q ||
        it.id.includes(q) ||
        it.name.toLowerCase().includes(q) ||
        it.name_en.toLowerCase().includes(q) ||
        it.category.toLowerCase().includes(q) ||
        it.subcategory.toLowerCase().includes(q);
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 80px; color: var(--text-dim); font-size: 16px;">无匹配的构图，请尝试其他关键词。</div>';
      return;
    }

    let html = '';
    filtered.forEach(it => {
      const verifiedTag = it.cal_status === 'ocr_verified' ? '🟢 真值已校准' : '⚪ 原版对齐';
      html += `
        <div class="compare-card">
          <div class="card-header">
            <div class="card-title-group">
              <span class="card-num">#${it.id}</span>
              <span class="card-name">${it.name}</span>
              <span class="card-en">${it.name_en}</span>
            </div>
            <span class="card-cat">${it.category}</span>
          </div>
          <div class="card-body">
            <!-- Col 1: Original Verified Poster -->
            <div class="col-wrapper">
              <div class="col-label orig">
                <span>原版图鉴</span>
                <span class="tag" title="来源文件: ${it.orig_filename}">${verifiedTag}</span>
              </div>
              <div class="img-box" onclick="openLightbox('${it.orig_img}')">
                <img src="${it.orig_img}" alt="${it.name} 原图" loading="lazy">
              </div>
            </div>

            <!-- Col 2: New High-Fidelity Card -->
            <div class="col-wrapper">
              <div class="col-label new">
                <span>1:1 升级复刻版</span>
                <span class="tag">1086×1448 印刷级</span>
              </div>
              <div class="img-box" onclick="openLightbox('${it.new_img}')">
                <img src="${it.new_img}" alt="${it.name} 复刻" loading="lazy" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'500\' height=\'660\'><rect width=\'100%\' height=\'100%\' fill=\'%23161b22\'/><text x=\'50%\' y=\'50%\' fill=\'%23555\' font-size=\'18\' text-anchor=\'middle\' font-family=\'sans-serif\'>待渲染生成</text></svg>';">
              </div>
            </div>
          </div>
          <div class="card-footer">
            <span style="font-size: 11px; opacity: 0.7;">原图真实来源: ${it.orig_filename}</span>
            <a class="view-link" href="${it.html_url}" target="_blank">查看独立 HTML ↗</a>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
